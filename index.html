<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TPY Code Runner - Free Online Playground</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
</head>
<body class="bg-slate-900 text-gray-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 py-3 px-6 flex flex-wrap justify-between items-center gap-3">
    <div class="flex items-center space-x-3">
      <div class="bg-blue-600 px-3 py-1 rounded-lg font-bold text-white">TPY</div>
      <h1 class="text-lg font-bold">TPY Telegram Bot Runner</h1>
    </div>
    <div id="status" class="text-xs px-3 py-1 bg-yellow-500/20 text-yellow-400 rounded-full border border-yellow-500/30">
      ইঞ্জিন লোড হচ্ছে...
    </div>
  </header>

  <!-- Bot Credentials Bar -->
  <div class="bg-slate-850 bg-slate-800/60 border-b border-slate-700/80 px-6 py-3">
    <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Bot API Token (@BotFather থেকে)</label>
        <input id="botToken" type="text" placeholder="123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ" 
          class="w-full bg-slate-950 border border-slate-700 rounded-md px-3 py-1.5 text-xs text-blue-300 font-mono focus:border-blue-500 focus:outline-none" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Telegram Chat ID / User ID</label>
        <input id="chatId" type="text" placeholder="123456789" 
          class="w-full bg-slate-950 border border-slate-700 rounded-md px-3 py-1.5 text-xs text-blue-300 font-mono focus:border-blue-500 focus:outline-none" />
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <main class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-4 p-4 max-w-7xl mx-auto w-full">
    
    <!-- Code Editor Area -->
    <div class="flex flex-col bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-lg">
      <div class="bg-slate-750 px-4 py-2 border-b border-slate-700 flex justify-between items-center">
        <span class="text-sm font-semibold text-slate-300">Editor (TPY Code)</span>
        <button id="runBtn" disabled onclick="runCode()" class="bg-blue-600 hover:bg-blue-500 disabled:bg-gray-600 text-white px-4 py-1.5 rounded-md font-medium transition flex items-center space-x-2 text-sm">
          <span>▶ রান করুন</span>
        </button>
      </div>
      <textarea id="code" class="flex-1 bg-slate-950 p-4 text-emerald-400 font-mono text-sm resize-none focus:outline-none" spellcheck="false">
# Bot.sendMessage() দিয়ে সরাসরি মেসেজ পাঠান
print("বট মেসেজ পাঠানোর চেষ্টা করছে...")

response = await Bot.sendMessage("🎉 অভিনন্দন! আপনার TPY Runner থেকে টেলিগ্রামে মেসেজ পৌঁছে গেছে!")

print(response)
      </textarea>
    </div>

    <!-- Output / Terminal Area -->
    <div class="flex flex-col bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-lg">
      <div class="bg-slate-750 px-4 py-2 border-b border-slate-700 flex justify-between items-center">
        <span class="text-sm font-semibold text-slate-300">Terminal Output</span>
        <button onclick="clearOutput()" class="text-xs text-gray-400 hover:text-white">ক্লিয়ার</button>
      </div>
      <pre id="output" class="flex-1 bg-black p-4 text-gray-200 font-mono text-sm overflow-auto whitespace-pre-wrap">আউটপুট এখানে দেখাবে...</pre>
    </div>

  </main>

  <footer class="text-center py-3 text-xs text-slate-500 border-t border-slate-800">
    100% Free TPY Telegram Bot Runner • Powered by WebAssembly & Pyodide
  </footer>

  <script>
    let pyodideInstance = null;
    const statusEl = document.getElementById("status");
    const runBtn = document.getElementById("runBtn");
    const outputEl = document.getElementById("output");

    async function loadEngine() {
      try {
        pyodideInstance = await loadPyodide();
        statusEl.innerText = "ইঞ্জিন রেডি (Active)";
        statusEl.className = "text-xs px-3 py-1 bg-green-500/20 text-green-400 rounded-full border border-green-500/30";
        runBtn.disabled = false;
      } catch (err) {
        statusEl.innerText = "লোড হতে ব্যর্থ!";
        statusEl.className = "text-xs px-3 py-1 bg-red-500/20 text-red-400 rounded-full border border-red-500/30";
        console.error(err);
      }
    }
    loadEngine();

    async function runCode() {
      if (!pyodideInstance) return;
      
      const token = document.getElementById("botToken").value.trim();
      const chat_id = document.getElementById("chatId").value.trim();
      const code = document.getElementById("code").value;
      
      outputEl.innerText = "কোড রান হচ্ছে...\n";

      try {
        pyodideInstance.setStdout({
          batched: (msg) => { outputEl.innerText += msg + "\n"; }
        });

        // Bot হেল্পার ক্লাস ইনজেক্ট করা হচ্ছে
        const helperScript = `
import json
from pyodide.http import pyfetch

class BotWrapper:
    def __init__(self, token, chat_id):
        self.token = token
        self.chat_id = chat_id

    async def sendMessage(self, text):
        if not self.token or not self.chat_id:
            return "⚠️ অনুগ্রহ করে ওয়েবসাইটের উপরে Bot Token এবং Chat ID দিন!"
        url = f"https://api.telegram.org/bot{self.token}/sendMessage"
        payload = {"chat_id": self.chat_id, "text": text}
        res = await pyfetch(url, method="POST", headers={"Content-Type": "application/json"}, body=json.dumps(payload))
        data = await res.json()
        if data.get("ok"):
            return "✅ মেসেজ টেলিগ্রামে পাঠানো হয়েছে!"
        return f"❌ এরর: {data.get('description')}"

Bot = BotWrapper("${token}", "${chat_id}")
`;
        await pyodideInstance.runPythonAsync(helperScript);
        await pyodideInstance.runPythonAsync(code);

      } catch (err) {
        outputEl.innerText += "\n[Error]: " + err.message;
      }
    }

    function clearOutput() { outputEl.innerText = ""; }
  </script>
</body>
</html>
