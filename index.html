<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TPY Code Runner - Free Online Playground</title>
  
  <!-- Tailwind CSS (ডিজাইনের জন্য) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Pyodide (ব্রাউজারে পাইথন রান করার ইঞ্জিন) -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
</head>
<body class="bg-slate-900 text-gray-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <div class="bg-blue-600 p-2 rounded-lg font-bold text-white">TPY</div>
      <h1 class="text-xl font-bold">TPY Code Runner (Online Playground)</h1>
    </div>
    <div id="status" class="text-sm px-3 py-1 bg-yellow-500/20 text-yellow-400 rounded-full border border-yellow-500/30">
      ইঞ্জিন লোড হচ্ছে...
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-4 p-4 max-w-7xl mx-auto w-full">
    
    <!-- Code Editor Area -->
    <div class="flex flex-col bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-lg">
      <div class="bg-slate-750 px-4 py-2 border-b border-slate-700 flex justify-between items-center">
        <span class="text-sm font-semibold text-slate-300">Editor (TPY Code)</span>
        <button id="runBtn" disabled onclick="runCode()" class="bg-blue-600 hover:bg-blue-500 disabled:bg-gray-600 text-white px-4 py-1.5 rounded-md font-medium transition flex items-center space-x-2 text-sm">
          <span>▶ রান করুন</span>
        </button>
      </div>
      <textarea id="code" class="flex-1 bg-slate-950 p-4 text-emerald-400 font-mono text-sm resize-none focus:outline-none" spellcheck="false">
# TPY / Python কোড এখানে লিখুন

user_name = "Rahim"
bot_name = "MyTeleBot"

print(f"বট শুরু হয়েছে: {bot_name}")

# সিম্পল মেসেজ পাঠানোর লজিক
def send_welcome(user):
    return f"স্বাগতম {user}! Telebot Creator-এ আপনার বট রেডি।"

output = send_welcome(user_name)
print(output)
      </textarea>
    </div>

    <!-- Output / Terminal Area -->
    <div class="flex flex-col bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-lg">
      <div class="bg-slate-750 px-4 py-2 border-b border-slate-700 flex justify-between items-center">
        <span class="text-sm font-semibold text-slate-300">Terminal Output</span>
        <button onclick="clearOutput()" class="text-xs text-gray-400 hover:text-white">ক্লিয়ার</button>
      </div>
      <pre id="output" class="flex-1 bg-black p-4 text-gray-200 font-mono text-sm overflow-auto whitespace-pre-wrap">আউটপুট এখানে দেখাবে...</pre>
    </div>

  </main>

  <!-- Footer -->
  <footer class="text-center py-3 text-xs text-slate-500 border-t border-slate-800">
    100% Free TPY Runner • Powered by WebAssembly & Pyodide
  </footer>

  <!-- Script for Execution -->
  <script>
    let pyodideInstance = null;
    const statusEl = document.getElementById("status");
    const runBtn = document.getElementById("runBtn");
    const outputEl = document.getElementById("output");

    // Pyodide লোড করা
    async function loadEngine() {
      try {
        pyodideInstance = await loadPyodide();
        statusEl.innerText = "ইঞ্জিন রেডি (Active)";
        statusEl.className = "text-sm px-3 py-1 bg-green-500/20 text-green-400 rounded-full border border-green-500/30";
        runBtn.disabled = false;
      } catch (err) {
        statusEl.innerText = "ইঞ্জিন লোড হতে ব্যর্থ!";
        statusEl.className = "text-sm px-3 py-1 bg-red-500/20 text-red-400 rounded-full border border-red-500/30";
        console.error(err);
      }
    }
    loadEngine();

    // কোড রান করার ফাংশন
    async function runCode() {
      if (!pyodideInstance) return;
      
      const code = document.getElementById("code").value;
      outputEl.innerText = "কোড রান হচ্ছে...\n";

      try {
        // print() এর আউটপুট ক্যাপচার করার সেটআপ
        pyodideInstance.setStdout({
          batched: (msg) => {
            outputEl.innerText += msg + "\n";
          }
        });

        // কোড এক্সিকিউট করা
        await pyodideInstance.runPythonAsync(code);
      } catch (err) {
        outputEl.innerText += "\n[Error]: " + err.message;
      }
    }

    function clearOutput() {
      outputEl.innerText = "";
    }
  </script>
</body>
</html>
