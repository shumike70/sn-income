<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telebot Creator - Custom Bot Builder & Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-900 text-gray-100 min-h-screen flex flex-col font-sans">

  <!-- Top Navbar -->
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-3 flex flex-wrap justify-between items-center gap-4">
    <div class="flex items-center space-x-3">
      <div class="bg-blue-600 text-white font-black p-2 rounded-lg text-lg shadow-md">TC</div>
      <div>
        <h1 class="font-bold text-base text-white">Telebot Creator Dashboard</h1>
        <p class="text-xs text-slate-400">GitHub & Vercel Edition • 24/7 Free Hosting</p>
      </div>
    </div>
    <div class="flex items-center space-x-3">
      <button onclick="connectWebhook()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs px-4 py-2 rounded-md shadow transition flex items-center space-x-2">
        <i class="fa-solid fa-bolt"></i>
        <span>Start Bot (Connect Webhook)</span>
      </button>
    </div>
  </header>

  <!-- Bot Token Bar -->
  <div class="bg-slate-850 bg-slate-800/80 border-b border-slate-700/60 px-6 py-3">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
      <div class="flex-1 min-w-[280px]">
        <label class="block text-xs font-semibold text-slate-400 mb-1">Bot API Token (@BotFather)</label>
        <input id="botToken" type="text" value="8693779636:AAHIeQCUgS7bvwrArl6otipy8wyifOgz8rU" placeholder="123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11" 
          class="w-full bg-slate-950 border border-slate-700 rounded-md px-3 py-1.5 text-xs text-blue-300 font-mono focus:border-blue-500 focus:outline-none" />
      </div>
      <div class="flex-1 min-w-[200px]">
        <label class="block text-xs font-semibold text-slate-400 mb-1">Admin / Owner ID</label>
        <input id="ownerId" type="text" value="7209869264" placeholder="7209869264" 
          class="w-full bg-slate-950 border border-slate-700 rounded-md px-3 py-1.5 text-xs text-blue-300 font-mono focus:border-blue-500 focus:outline-none" />
      </div>
    </div>
  </div>

  <!-- Main Dashboard Layout -->
  <main class="flex-1 max-w-7xl mx-auto w-full p-4 grid grid-cols-1 md:grid-cols-4 gap-4">
    
    <!-- Left Sidebar: Commands Manager -->
    <div class="bg-slate-800 rounded-xl border border-slate-700 flex flex-col overflow-hidden shadow">
      <div class="p-3 bg-slate-750 border-b border-slate-700 flex justify-between items-center">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-300">Commands List</span>
        <button onclick="addNewCommand()" class="text-xs bg-blue-600 hover:bg-blue-500 text-white px-2 py-1 rounded font-medium flex items-center space-x-1">
          <i class="fa-solid fa-plus"></i>
          <span>Add</span>
        </button>
      </div>
      <div id="commandList" class="flex-1 overflow-y-auto divide-y divide-slate-750 p-2 space-y-1">
        <!-- Dynamic Commands Appended Here -->
      </div>
    </div>

    <!-- Right Side: Code Editor -->
    <div class="md:col-span-3 bg-slate-800 rounded-xl border border-slate-700 flex flex-col overflow-hidden shadow">
      <div class="p-3 bg-slate-750 border-b border-slate-700 flex justify-between items-center">
        <div class="flex items-center space-x-2">
          <span class="text-xs text-slate-400">Editing:</span>
          <span id="currentCommandLabel" class="text-xs font-bold text-emerald-400 bg-slate-900 px-2 py-0.5 rounded border border-slate-700 font-mono">/start</span>
        </div>
        <div class="flex items-center space-x-2">
          <button onclick="saveCurrentCommand()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1 rounded text-xs font-semibold flex items-center space-x-1 transition">
            <i class="fa-solid fa-floppy-disk"></i>
            <span>Save Command</span>
          </button>
        </div>
      </div>
      
      <!-- Editor Area -->
      <textarea id="commandEditor" class="flex-1 bg-slate-950 p-4 text-emerald-400 font-mono text-xs leading-relaxed resize-none focus:outline-none min-h-[420px]" spellcheck="false"></textarea>
      
      <!-- Status Footer -->
      <div id="saveNotification" class="bg-slate-900 px-4 py-2 border-t border-slate-800 text-xs text-slate-400 flex justify-between items-center">
        <span>Press "Save Command" to store changes.</span>
        <span class="text-emerald-400">TPY v7.1.1</span>
      </div>
    </div>

  </main>

  <footer class="text-center py-3 text-xs text-slate-500 border-t border-slate-800">
    Telebot Creator GitHub & Vercel Edition • Created by SN Support
  </footer>

  <script>
    // ডিফল্ট কমান্ডস ডাটাবেজ
    let commands = JSON.parse(localStorage.getItem("tpy_commands")) || {
      "/start": `# =========================
# Main /start Command
# =========================
first_name = message.from_user.first_name
username = message.from_user.username or "N/A"
uid = message.from_user.id

welcome_text = f"""
◈ ━━ ❖ 📋 <b>MAIN MENU</b> ❖ ━━ ◈

🎊 <b>WELCOME :</b> {first_name}
👤 <b>USER :</b> @{username}
🆔 <b>ID :</b> <code>{uid}</code>

━━━━━━━━━━━━━━━━━━━━━━━━
⚡ <b>OUR SERVICES & FEATURES :</b>
━━━━━━━━━━━━━━━━━━━━━━━━
💡 <b>CREATE, CUSTOMIZE & SCALE BOTS</b>
🔧 <b>PROFESSIONAL BOT MAKER</b>
🌐 <b>SMART & SECURE TELEGRAM BOTS</b>

━━━━━━━━━━━━━━━━━━━━━━━━
👑 <b>DEVELOPED BY :</b> @sn_support_admin
━━━━━━━━━━━━━━━━━━━━━━━━
"""

keyboard = [
    [{"text": "🌟 𝐏𝐑𝐎𝐅𝐈𝐋𝐄", "callback_data": "/profile"}, {"text": "🛠️ 𝐌𝐘 𝐁𝐎𝐓", "callback_data": "/mybots"}],
    [{"text": "➕ 𝐂𝐑𝐄𝐀𝐓𝐄 𝐍𝐄𝐖 𝐁𝐎𝐓", "callback_data": "/newbot"}],
    [{"text": "🏆 𝐋𝐄𝐀𝐃𝐄𝐑𝐁𝐎𝐀𝐑𝐃", "callback_data": "/leaderboard"}, {"text": "❓ 𝐀𝐍𝐘 𝐇𝐄𝐋𝐏", "callback_data": "/help"}],
    [{"text": "🛒 𝐁𝐔𝐘 𝐂𝐎𝐃𝐄", "callback_data": "/buy_code"}]
]

Bot.sendMessage(chat_id=uid, text=welcome_text, reply_markup={"inline_keyboard": keyboard}, parse_mode="HTML")`,

      "/help": `uid = message.from_user.id
Bot.sendMessage(chat_id=uid, text="ℹ️ <b>যেকোনো সাহায্যের জন্য আমাদের সাথে যোগাযোগ করুন:</b>\\n👉 @sn_support_admin", parse_mode="HTML")`,

      "/profile": `uid = message.from_user.id
name = message.from_user.first_name
Bot.sendMessage(chat_id=uid, text=f"👤 <b>ইউজার প্রোফাইল</b>\\n\\n🆔 আইডি: <code>{uid}</code>\\n👤 নাম: {name}\\n💰 ব্যালেন্স: ০.০০ ৳", parse_mode="HTML")`
    };

    let activeCmd = "/start";

    function renderCommandList() {
      const listEl = document.getElementById("commandList");
      listEl.innerHTML = "";
      for (let cmd in commands) {
        const isSelected = cmd === activeCmd;
        const div = document.createElement("div");
        div.className = `flex justify-between items-center p-2 rounded cursor-pointer text-xs font-mono transition ${isSelected ? 'bg-blue-600 text-white font-bold' : 'hover:bg-slate-700 text-slate-300'}`;
        div.onclick = () => selectCommand(cmd);
        div.innerHTML = `
          <span><i class="fa-solid fa-terminal mr-1.5 opacity-70"></i>${cmd}</span>
          ${cmd !== '/start' ? `<button onclick="deleteCommand(event, '${cmd}')" class="text-red-400 hover:text-red-200 ml-2"><i class="fa-solid fa-trash"></i></button>` : ''}
        `;
        listEl.appendChild(div);
      }
      document.getElementById("currentCommandLabel").innerText = activeCmd;
      document.getElementById("commandEditor").value = commands[activeCmd] || "";
    }

    function selectCommand(cmd) {
      activeCmd = cmd;
      renderCommandList();
    }

    function addNewCommand() {
      const name = prompt("নতুন কমান্ডের নাম দিন (যেমন: /balance, /bonus):");
      if (name) {
        const formatted = name.startsWith("/") ? name : "/" + name;
        if (!commands[formatted]) {
          commands[formatted] = `# New command ${formatted}\\nuid = message.from_user.id\\nBot.sendMessage(chat_id=uid, text="কমান্ড চালু হয়েছে!")`;
          activeCmd = formatted;
          saveToStorage();
          renderCommandList();
        } else {
          alert("এই কমান্ডটি ইতিমধ্যে বিদ্যমান আছে!");
        }
      }
    }

    function deleteCommand(e, cmd) {
      e.stopPropagation();
      if (confirm(`আপনি কি ${cmd} কমান্ডটি ডিলিট করতে চান?`)) {
        delete commands[cmd];
        activeCmd = "/start";
        saveToStorage();
        renderCommandList();
      }
    }

    function saveCurrentCommand() {
      commands[activeCmd] = document.getElementById("commandEditor").value;
      saveToStorage();
      const notif = document.getElementById("saveNotification");
      notif.innerHTML = `<span class="text-green-400 font-bold"><i class="fa-solid fa-circle-check"></i> ${activeCmd} কমান্ড সেভ সফল হয়েছে!</span><span class="text-emerald-400">Saved</span>`;
      setTimeout(() => {
        notif.innerHTML = `<span>Press "Save Command" to store changes.</span><span class="text-emerald-400">TPY v7.1.1</span>`;
      }, 2500);
    }

    function saveToStorage() {
      localStorage.setItem("tpy_commands", JSON.stringify(commands));
    }

    function connectWebhook() {
      const token = document.getElementById("botToken").value.trim();
      const domain = window.location.origin;
      const webhookUrl = `${domain}/api/webhook`;

      if (!token) {
        alert("অনুগ্রহ করে Bot Token দিন!");
        return;
      }

      window.open(`https://api.telegram.org/bot${token}/setWebhook?url=${webhookUrl}&drop_pending_updates=true`, '_blank');
    }

    renderCommandList();
  </script>
</body>
</html>
